<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · BMXTOOLS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">

<header class="site-header">
  <a href="index.html" class="logo">BMX<span class="logo-accent">TOOLS</span></a>
  <nav class="site-nav">
    <a href="index.html">Map Creator</a>
    <a href="maps.html">BMX MAPS</a>
    <a href="training.html">Training MAP</a>
    <a href="challenges.html">Challenges</a>
    <a href="resources.html">Resources</a>
    <a href="coaching.html">Online Coaching</a>
  </nav>
  <div id="navAuth"></div>
</header>

<div class="pinboard-container">
  <div class="board-header">
    <h2>Log In</h2>
    <p class="board-description">Welcome back. Log in to sync your maps, training, and favorites.</p>
  </div>

  <form class="auth-card" id="loginForm">
    <div class="auth-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="auth-error" id="loginError" hidden></div>
    <button type="submit" class="auth-submit" id="loginSubmit">Log In</button>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('loginError');
  const submit = document.getElementById('loginSubmit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Logging in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      await window.BMX.auth.signIn(email, password);
      window.location.href = 'index.html';
    } catch (err) {
      errEl.textContent = err.message || 'Login failed';
      errEl.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Log In';
    }
  });
})();
</script>
</body>
</html>
