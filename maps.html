<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMX Maps · BMXTOOLS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="maps">

<header class="site-header">
  <a href="index.html" class="logo">BMX<span class="logo-accent">TOOLS</span></a>
  <nav class="site-nav">
    <a href="index.html">Map Creator</a>
    <a href="maps.html" class="active">BMX MAPS</a>
    <a href="training.html">Training MAP</a>
    <a href="challenges.html">Challenges</a>
    <a href="resources.html">Resources</a>
    <a href="coaching.html">Online Coaching</a>
</nav>
  <div id="navAuth"></div>
</header>

<div class="pinboard-container">
  <div class="board-header">
    <h2>BMX Maps</h2>
    <p class="board-description">Browse curated maps or open one of your own.</p>
  </div>

  <div class="board-layout">
    <div class="map-column">
      <div class="image-pin-wrapper" id="imageWrapper" data-map-id="bmx-maps">
        <img
          class="static-image"
          id="staticImage"
          draggable="false"
          alt="Map of the United States"
          src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Blank_US_Map_%28states_only%29.svg"
        />
      </div>
    </div>

    <div class="pins-panel" id="pinsPanel">
      <!-- injected -->
    </div>
  </div>

  <div class="hint">
    <span>🔹 click map to place the active pin type</span>
    <span>✏️ click a pin to edit</span>
    <span>☑️ checkbox hides the whole list</span>
    <span><kbd>⌘/Ctrl</kbd> + click pin to remove</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="maps-data.js"></script>
<script src="script.js"></script>
</body>
</html>
